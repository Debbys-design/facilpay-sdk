name: Bug report
about: Report a reproducible bug in the SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the fields below so we can reproduce and fix the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The version of the SDK you are using (e.g. from package.json).
      placeholder: "1.2.3"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where are you running the SDK?
      options:
        - Node
        - Bun
        - Deno
        - Edge
        - Browser
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: requestId
      description: If available, the requestId associated with the failing request (helps us trace it).
      placeholder: "req_..."
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or stack traces.
    validations:
      required: false
